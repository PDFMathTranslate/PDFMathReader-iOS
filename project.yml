name: PDFMathReader
options:
  bundleIdPrefix: com.pdfmathtranslate
  developmentLanguage: en
  knownRegions:
    - ar
    - arz
    - bn
    - de
    - en
    - es
    - fr
    - hi
    - ja
    - ko
    - pcm
    - pt
    - ru
    - ur
    - zh-CN
    - zh-TW
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ReaderCore:
    path: Packages/ReaderCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PDFMathReader:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: App/Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: App/Resources/Fonts
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ReaderCore
    info:
      path: App/Info.plist
      properties:
        UIAppFonts:
          - NotoSerifCJKsc-Regular.otf
          - NotoSerifCJKsc-Bold.otf
          - NotoSerifCJKtc-Regular.otf
          - NotoSerifCJKtc-Bold.otf
        CFBundleDisplayName: PDFMathReader
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsMultipleScenes: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.pdfmathtranslate.PDFMathReader.continuedProcessingTask.*
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: PDFMathReader discovers nearby computers and connects to their shared translation kernels on your local network.
        NSBonjourServices:
          - _pdfmathreader._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # iOS 17+ requires explicit HTTP exceptions for IP literals, even over VPN.
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fd7a:115c:a1e0::/48":
              NSExceptionAllowsInsecureHTTPLoads: true
            "ts.net":
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfmathtranslate.PDFMathReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconWarm AppIconSpring AppIconClassic AppIconBlueprint AppIconMoon AppIconModern"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  PDFMathReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/Tests]
    dependencies:
      - target: PDFMathReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PDFMathReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: PDFMathReader
    settings:
      base:
        TEST_TARGET_NAME: PDFMathReader
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PDFMathReader:
    build:
      targets:
        PDFMathReader: all
        PDFMathReaderTests: [test]
        PDFMathReaderUITests: [test]
    test:
      targets: [PDFMathReaderTests, PDFMathReaderUITests]
      gatherCoverageData: false
